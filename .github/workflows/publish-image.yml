# Construye, prueba y publica la imagen de trakt-manager en GitHub Container Registry.
#
# - En pull requests: solo tests (no se publica nada).
# - En push a main: tests y, si pasan, publica :latest y :sha-<corto>.
# - En etiquetas v*: tests y, si pasan, publica :X.Y.Z y :X.Y.
#
# La imagen es multiarquitectura (amd64 y arm64) para que funcione igual en Macs
# con Apple Silicon y en equipos x86. Para descargarla sin iniciar sesión, el
# paquete debe ser público (paso manual único en la configuración del paquete en GitHub).

name: Publicar imagen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Un único despliegue por rama o etiqueta a la vez; uno nuevo cancela el anterior.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Los tests se ejecutan dentro de la imagen de desarrollo, igual que en local
      # con `docker compose run --rm tests`.
      - name: Construir la imagen de tests
        run: docker build --target dev -t trakt-manager-tests .

      - name: Ejecutar los tests
        run: docker run --rm trakt-manager-tests

  publish:
    name: Publicar en GHCR
    needs: test
    # Solo en push (rama main o etiqueta), nunca en pull requests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU permite construir la variante arm64 en un runner x86.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcula las etiquetas de la imagen y las etiquetas OCI (origen, versión, revisión).
      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La caché de GitHub Actions evita recompilar capas sin cambios (sobre todo la de arm64).
          cache-from: type=gha
          cache-to: type=gha,mode=max
