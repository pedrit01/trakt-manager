# Levanta la API y la GUI web de trakt-manager y permite ejecutar el CLI con la misma imagen.
#
#   docker compose up -d           # descarga la imagen publicada en GHCR y arranca GUI y API
#                                  # en http://127.0.0.1:8000 (ver API_BIND / API_PORT)
#   docker compose up -d --build   # construye la imagen desde el código local (desarrollo)
#
# El .env es opcional: sin él, la GUI muestra un asistente para configurar las
# credenciales de Trakt y la API_KEY (el código de configuración sale en
# `docker compose logs`). Con .env, sus valores tienen prioridad sobre los de la GUI.
#
#   docker compose run --rm trakt-manager auth login
#   docker compose run --rm trakt-manager sync lists/doomsday.yaml --dry-run
#   docker compose run --rm tests   # tests (perfil dev)

services:
  trakt-manager:
    # Con `image` y `build` a la vez, `up` descarga la imagen publicada y solo la
    # construye en local con `--build`; así instalar no exige compilar nada.
    image: ghcr.io/pedrit01/trakt-manager:${TRAKT_MANAGER_VERSION:-latest}
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    # Valores internos del contenedor: tienen prioridad sobre .env para que, por
    # ejemplo, cambiar API_PORT solo cambie el puerto publicado en el anfitrión.
    environment:
      DATA_DIR: /data
      LISTS_DIR: /app/lists
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    # Por defecto solo se publica en este equipo (127.0.0.1). Para acceder desde
    # otros equipos pon API_BIND=0.0.0.0 en .env o usa un proxy inverso con TLS.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - trakt-data:/data # token de Trakt, persiste entre reinicios
      - ./lists:/app/lists:ro # definiciones editables desde el anfitrión
    restart: unless-stopped

  tests:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    # Se monta el código para probar los cambios sin reconstruir la imagen.
    volumes:
      - ./src:/src/src
      - ./tests:/src/tests
      - ./lists:/src/lists

volumes:
  trakt-data:
